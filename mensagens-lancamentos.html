<style>
:root{
  --roxo:        #7C3AED;
  --roxo-dark:   #5B21B6;
  --roxo-deep:   #3B0F73;
  --roxo-light:  #A78BFA;
  --roxo-xlight: #EDE9FE;
  --preto:   #0A0A0A;
  --ink:     #141018;
  --cinza:   #5B5566;
  --linha:   #E7E3EE;
  --bg:      #FFFFFF;
  --bg-soft: #FAF9FC;
  --verde:   #15803D;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); font-family: 'Poppins', sans-serif; color: var(--ink); }

/* ===== HERO ===== */
.hero {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(1100px 500px at 78% -10%, rgba(124,58,237,.55), transparent 60%),
    linear-gradient(150deg, #0A0A0A 0%, #17111F 45%, #3B0F73 100%);
  padding: 6vh 28px 7vh;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  pointer-events: none;
}
.hero-conteudo { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }

.brand { display: flex; align-items: center; gap: 14px; }
.brand svg { width: 34px; height: 34px; flex-shrink: 0; }
.brand .word { display: flex; align-items: center; gap: 10px; font-weight: 300; color: #fff; }
.brand .word b { font-weight: 800; font-size: 16px; }
.brand .word .bar { width: 2px; height: 22px; background: rgba(255,255,255,.55); }
.brand .word span { font-size: 16px; letter-spacing: .22em; }

.pill {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--roxo-light); color: var(--roxo-light);
  border-radius: 100px; padding: 8px 18px;
  font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  background: transparent;
}
.pill.solid { background: linear-gradient(90deg, var(--roxo), var(--roxo-dark)); color: #fff; border-color: transparent; }

h1 { font-weight: 800; font-size: clamp(32px, 4.4vw, 52px); letter-spacing: -.02em; line-height: 1.15; color: #fff; }
h1 .destaque { color: var(--roxo-light); }
p.hero-sub { font-size: clamp(15px, 1.6vw, 17px); font-weight: 300; color: rgba(255,255,255,.72); max-width: 640px; line-height: 1.6; }

.hero-tag { margin: 3.2vh 0 2vh; }

/* ===== SEÇÃO / LAYOUT ===== */
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 28px; }
main { padding: 6vh 0 8vh; }

.section-label {
  display: flex; align-items: center; gap: 12px;
  font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  color: var(--roxo); margin-bottom: 2.4vh;
}
.section-label::before { content: ''; width: 34px; height: 2px; background: var(--roxo); border-radius: 2px; }

/* ===== PÍLULAS DE NAVEGAÇÃO ===== */
nav.abas-lancamento { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 5vh; padding-bottom: 4vh; border-bottom: 1px solid var(--linha); }
.aba-lanc {
  font-family: inherit; cursor: pointer;
  border: 1px solid var(--roxo-light); color: var(--roxo-dark);
  background: transparent; border-radius: 100px; padding: 10px 22px;
  font-size: 13px; font-weight: 600; letter-spacing: .06em;
  transition: all .15s;
}
.aba-lanc:hover { background: var(--roxo-xlight); }
.aba-lanc.ativa { background: linear-gradient(90deg, var(--roxo), var(--roxo-dark)); color: #fff; border-color: transparent; }

nav.abas-categoria { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4vh; }
.aba-cat {
  font-family: inherit; cursor: pointer;
  border: 1px solid var(--linha); color: var(--cinza);
  background: var(--bg-soft); border-radius: 10px; padding: 9px 18px;
  font-size: 13px; font-weight: 500; transition: all .15s;
}
.aba-cat:hover { color: var(--ink); border-color: var(--roxo-light); }
.aba-cat.ativa { background: var(--roxo-xlight); color: var(--roxo-dark); border-color: var(--roxo-light); font-weight: 600; }

.painel-lancamento { display: none; }
.painel-lancamento.ativo { display: block; animation: fadein .3s ease; }
.painel-categoria { display: none; }
.painel-categoria.ativo { display: block; animation: fadein .3s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===== CARD DE MENSAGEM ===== */
.msg-card {
  background: var(--bg-soft);
  border: 1px solid var(--linha);
  border-radius: 18px;
  padding: 26px 28px;
  margin-bottom: 22px;
}
.msg-topo { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.msg-titulo { font-size: 18px; font-weight: 700; color: var(--ink); }
.chip {
  font-size: 12px; font-weight: 600; color: var(--roxo-dark);
  background: var(--roxo-xlight); border: 1px solid var(--roxo-light);
  padding: 5px 14px; border-radius: 999px;
}
.blocos { display: flex; flex-direction: column; gap: 14px; }
.bloco {
  position: relative;
  background: #fff;
  border: 1px solid var(--linha);
  border-radius: 14px;
  padding: 18px 20px 16px;
}
.bloco .bloco-label {
  font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: var(--roxo); margin-bottom: 10px;
}
.bloco .bloco-texto {
  font-size: 15px; font-weight: 300; color: var(--ink);
  line-height: 1.65; white-space: pre-wrap; padding-right: 42px;
}
.bloco .bloco-texto a { color: var(--roxo-dark); word-break: break-all; }
.bloco .anexos { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.bloco .anexo {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 600; color: var(--roxo-dark);
  background: var(--roxo-xlight); border: 1px solid var(--roxo-light);
  padding: 6px 14px; border-radius: 999px; text-decoration: none;
}
.bloco .anexo:hover { background: var(--roxo-light); color: #fff; }
.bloco .anexo.anexo-pendente {
  color: var(--cinza); background: var(--bg-soft); border-style: dashed; cursor: default;
}
.bloco .anexo.anexo-pendente:hover { background: var(--bg-soft); color: var(--cinza); }

.btn-copiar {
  position: absolute; top: 14px; right: 14px;
  width: 30px; height: 30px; border-radius: 8px;
  background: #fff; border: 1px solid var(--roxo-light);
  color: var(--roxo); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.btn-copiar:hover { background: var(--roxo); color: #fff; }
.btn-copiar.copiado { border-color: var(--verde); color: var(--verde); background: #F0FDF4; }
.btn-copiar svg { width: 15px; height: 15px; }

.bloco.bloco-pendente { border-style: dashed; background: var(--bg-soft); }
.bloco-nota { font-size: 13px; font-weight: 300; color: var(--cinza); font-style: italic; }

.campo-editavel {
  font-family: inherit; font-size: inherit; font-weight: 600; color: var(--roxo-dark);
  border: none; border-bottom: 2px dashed var(--roxo-light); background: var(--roxo-xlight);
  padding: 1px 6px; border-radius: 4px; width: 76px; text-align: center;

.campo-editavel:focus { outline: none; border-bottom-style: solid; }

.bloco-instrucao {
  margin-top: 12px; font-size: 12.5px; font-weight: 300; color: var(--cinza);
  font-style: italic; line-height: 1.5;
}

.msg-card.placeholder {
  border-style: dashed; background: transparent;
  padding: 22px 28px;
}
.msg-card.placeholder .msg-titulo { font-size: 14px; font-weight: 500; color: var(--cinza); }
.placeholder-nota {
  margin-top: 8px; font-size: 13px; font-weight: 300; color: var(--cinza);
  max-width: 760px; line-height: 1.55;

.estado-vazio {
  border: 1px dashed var(--linha); border-radius: 18px;
  padding: 5vh 2vw; text-align: center; color: var(--cinza);
  font-size: 14px; font-weight: 300; background: var(--bg-soft);

/* ===== FOOTER ===== */
footer.rodape {
  background: var(--ink);
  padding: 5vh 28px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;

footer.rodape p { font-size: 12.5px; color: rgba(255,255,255,.55); font-weight: 300; }

@media (max-width: 760px) {
  .hero { padding: 5vh 20px 6vh; }
  .wrap { padding: 0 20px; }
  .msg-topo { flex-direction: column; align-items: flex-start; }
}
</style>

                texto: `👉 Bora garantir sua vaga e todos os bônus?\n\nClique no link abaixo e comece agora:\n\nhttps://aimhouse.com.br/ofertastart/\n\nVocês nasceram para serem grandes autoridades. 👑`
              }
            ]
          },
          {
            titulo: 'Mensagem 9 — Encerramento do Dia 1',
            gatilho: true,
            horario: 'No encerramento do Dia 1 (25/07)',
            blocos: [
              {
                texto: `✅ Encerramos o Dia 1! 🎉\n\nVimos muita coisa hoje e ainda abrimos as vagas para a mentoria AIM Start. Mas calma, ainda não acabou! 👀\n\nAmanhã tem Dia 2 e vem coisa boa:\n\n🎤 Oratória e comunicação estratégica\n💬 Pitch implacável\n📈 Funis que escalam seu negócio mensalmente\n🚀 Como sair do zero pra faturar R$10 milhões em 2 anos\n\n⏰ Amanhã, às 9h00, estaremos ao vivo. O link será enviado aqui no grupo dos inscritos.`
              }
            ]
          }
        ]

      { key: 'dia2', label: 'Dia 2 (26/07)', mensagens: [] }

};

const iconeCopiar = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const iconeCheck = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function linkify(html) {
  return html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function renderBloco(bloco, idx) {
  if (bloco.pendente) {
    return `
    <div class="bloco bloco-pendente">
      <div class="bloco-label">Bloco ${idx + 1}</div>
      <div class="bloco-nota">⏳ ${bloco.nota || 'Conteúdo ainda não cadastrado.'}</div>
    </div>`;
  }
  let textoHtml;
  if (bloco.editavel) {
    const partes = bloco.texto.split(bloco.editavel.token);
    const antes = linkify(escapeHtml(partes[0]));
    const depois = linkify(escapeHtml(partes[1]));
    textoHtml = `${antes}<input type="text" class="campo-editavel" data-token="${encodeURIComponent(bloco.editavel.token)}" value="${bloco.editavel.default}">${depois}`;
  } else {
    textoHtml = linkify(escapeHtml(bloco.texto));
  }
  const anexosHtml = (bloco.anexos || []).map(anexo =>
    anexo.pendente
      ? `<span class="anexo anexo-pendente">⏳ ${anexo.label}</span>`
      : `<a class="anexo" href="${anexo.url}" target="_blank" rel="noopener">${anexo.label}</a>`
  ).join('');
  const instrucaoHtml = bloco.instrucao ? `<div class="bloco-instrucao">ℹ️ ${bloco.instrucao}</div>` : '';
  return `
    <div class="bloco">
      <button class="btn-copiar" onclick="copiarBloco(this)" aria-label="Copiar bloco" title="Copiar texto">${iconeCopiar}</button>
      <div class="bloco-label">Bloco ${idx + 1}</div>
      <div class="bloco-texto" data-raw="${encodeURIComponent(bloco.texto)}">${textoHtml}</div>
      ${anexosHtml ? `<div class="anexos">${anexosHtml}</div>` : ''}
      ${instrucaoHtml}
    </div>`;
}

function renderMensagem(msg) {
  if (msg.placeholder) {
    return `
    <div class="msg-card placeholder">
      <div>
        <span class="msg-titulo">${msg.titulo} · ainda não cadastrada</span>
        ${msg.nota ? `<div class="placeholder-nota">${msg.nota}</div>` : ''}
      </div>
    </div>`;
  }
  const blocosHtml = msg.blocos.map(renderBloco).join('');
  return `
    <div class="msg-card">
      <div class="msg-topo">
        <span class="msg-titulo">${msg.titulo}</span>
        ${msg.horario ? `<span class="chip">${msg.gatilho ? '🎯' : '🕐'} ${msg.horario}</span>` : ''}
      </div>
      <div class="blocos">${blocosHtml}</div>
    </div>`;
}

function renderCategoria(cat) {
  if (!cat.mensagens.length) {
    return `<div class="estado-vazio">Nenhuma mensagem cadastrada ainda em <strong>${cat.label}</strong>.</div>`;
  }
  return cat.mensagens.map(renderMensagem).join('');
}

function montarLancamento(key, lanc) {
  const categoriasNav = lanc.categorias.map((cat, i) =>
    `<button class="aba-cat ${i === 0 ? 'ativa' : ''}" data-cat="${cat.key}" onclick="mostrarCategoria('${key}','${cat.key}',this)">${cat.label}</button>`
  ).join('');
  const categoriasPaineis = lanc.categorias.map((cat, i) =>
    `<div class="painel-categoria ${i === 0 ? 'ativo' : ''}" data-cat="${key}-${cat.key}">${renderCategoria(cat)}</div>`
  ).join('');
  return `
    <nav class="abas-categoria">${categoriasNav}</nav>
    ${categoriasPaineis}`;
}

function montarPagina() {
  const abasNav = document.getElementById('abasLancamento');
  const paineis = document.getElementById('paineisLancamento');
  const keys = Object.keys(LANCAMENTOS);
  keys.forEach((key, i) => {
    const lanc = LANCAMENTOS[key];
    const aba = document.createElement('button');
    aba.className = 'aba-lanc' + (i === 0 ? ' ativa' : '');
    aba.textContent = lanc.label;
    aba.onclick = () => mostrarLancamento(key, aba);
    abasNav.appendChild(aba);

    const painel = document.createElement('div');
    painel.className = 'painel-lancamento' + (i === 0 ? ' ativo' : '');
    painel.dataset.lanc = key;
    painel.innerHTML = montarLancamento(key, lanc);
    paineis.appendChild(painel);
  });
}

function mostrarLancamento(key, btn) {
  document.querySelectorAll('.aba-lanc').forEach(b => b.classList.remove('ativa'));
  btn.classList.add('ativa');
  document.querySelectorAll('.painel-lancamento').forEach(p => p.classList.toggle('ativo', p.dataset.lanc === key));
}

function mostrarCategoria(lancKey, catKey, btn) {
  const nav = btn.parentElement;
  nav.querySelectorAll('.aba-cat').forEach(b => b.classList.remove('ativa'));
  btn.classList.add('ativa');
  const container = nav.parentElement;
  container.querySelectorAll('.painel-categoria').forEach(p => {
    p.classList.toggle('ativo', p.dataset.cat === `${lancKey}-${catKey}`);
  });
}

function feedbackCopiado(el) {
  const original = el.innerHTML;
  el.classList.add('copiado');
  el.innerHTML = iconeCheck;
  setTimeout(() => { el.classList.remove('copiado'); el.innerHTML = original; }, 1500);
}

function textoAtualDoBloco(bloco) {
  let texto = decodeURIComponent(bloco.querySelector('.bloco-texto').dataset.raw);
  const input = bloco.querySelector('.campo-editavel');
  if (input) {
    const token = decodeURIComponent(input.dataset.token);
    texto = texto.split(token).join(input.value || input.placeholder || '');
  }
  return texto;
}

function copiarBloco(btn) {
  const bloco = btn.closest('.bloco');
  copiarParaClipboard(textoAtualDoBloco(bloco), btn);
}

function copiarParaClipboard(texto, btn) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(() => feedbackCopiado(btn)).catch(() => copiarComFallback(texto, btn));
  } else {
    copiarComFallback(texto, btn);
  }
}

function copiarComFallback(texto, btn) {
  const area = document.createElement('textarea');
  area.value = texto;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.focus();
  area.select();
  try { document.execCommand('copy'); feedbackCopiado(btn); } catch (e) {}
  document.body.removeChild(area);
}

montarPagina();
</script>
